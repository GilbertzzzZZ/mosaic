name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        if: matrix.node == 24
        run: |
          bytes=$(wc -c < main.js)
          limit=$((1800 * 1024))
          echo "\`main.js\`: **$((bytes / 1024)) KiB** / $((limit / 1024)) KiB budget" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::main.js is $((bytes / 1024)) KiB, over the $((limit / 1024)) KiB budget."
            exit 1
          fi
