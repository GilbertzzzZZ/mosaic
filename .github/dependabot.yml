version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      types:
        patterns:
          - "@types/*"
      build-tooling:
        patterns:
          - esbuild
          - typescript
          - obsidian
    ignore:
      # 图表引擎的 major 升级会整套换掉底层 G2 的 API，属独立工程，
      # 必须人工规划并做全量视觉回归，不接受自动 PR。
      - dependency-name: "@ant-design/plots"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@antv/g2"
        update-types: ["version-update:semver-major"]
      # react/react-dom 是指向 @preact/compat 的 npm alias，两个名字都列以覆盖
      # Dependabot 对 alias 的匹配歧义。
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@preact/compat"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
